name: Sync RSS Data

on:
  schedule:
    - cron: '0 * * * *' # Каждый час
  workflow_dispatch: # Кнопка ручного запуска

permissions:
  contents: write # ← КРИТИЧЕСКИ ВАЖНО! Без этого git push упадет с ошибкой

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install rss-parser

      - name: Run parser script
        run: node fetch-rss.js

      - name: Commit and Push changes
        run: |
          git config --global user.name 'U4astie Bot'
          git config --global user.email 'bot@u4site.ru'
          git add news.json initiatives.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Автообновление данных RSS" && git push)
