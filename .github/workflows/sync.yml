name: Sync RSS Data

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install cheerio

      - name: Run parser script
        run: node fetch-rss.js

      - name: Commit and Push changes
        run: |
          git config --global user.name 'U4astie Bot'
          git config --global user.email 'bot@u4site.ru'
          git add news.json initiatives.json avtory.json images/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Автообновление из Telegram" && git push)
